services:
  db:
    image: postgres:16-alpine
    container_name: nexatech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexatech
      POSTGRES_USER: nexatech_user
      POSTGRES_PASSWORD: nexatech_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  web:
    build: .
    container_name: nexatech_php
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nexatech
      DB_USER: nexatech_user
      DB_PASS: nexatech_pass
    volumes:
      - .:/var/www/html
    depends_on:
      - db

volumes:
  pgdata: